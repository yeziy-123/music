<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>mpMusic</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #ffffff;
    --bg-secondary: #f5f5f7;
    --text: #1d1d1f;
    --text-secondary: #86868b;
    --border: rgba(0,0,0,0.08);
    --accent: #0066ff;
    --accent-light: #e6f0ff;
    --radius: 16px;
    --radius-sm: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.06);
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  @media (orientation: portrait) {
    body::before {
      content: "请旋转设备至横屏以获得最佳体验";
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text-secondary);
      padding: 40px;
      text-align: center;
    }
  }

  .app {
    display: flex;
    width: 100vw;
    height: 100vh;
    will-change: transform;
  }

  /* ===== Sidebar ===== */
  .sidebar {
    width: 200px;
    height: 100%;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 32px 20px;
    flex-shrink: 0;
    position: relative;
  }

  .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 40px;
    color: var(--text);
    opacity: 0;
    transform: translateY(-8px);
    animation: fadeSlideDown 0.6s var(--ease-out-expo) 0.1s forwards;
  }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 15px;
    cursor: pointer;
    margin-bottom: 8px;
    transition: all 0.35s var(--ease-smooth);
    font-family: inherit;
    position: relative;
    opacity: 0;
    transform: translateX(-12px);
    animation: fadeSlideRight 0.5s var(--ease-out-expo) forwards;
  }

  .nav-btn:nth-child(2) { animation-delay: 0.15s; }
  .nav-btn:nth-child(3) { animation-delay: 0.2s; }
  .nav-btn:nth-child(4) { animation-delay: 0.25s; }

  .nav-btn::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%) scaleY(0);
    width: 3px;
    height: 20px;
    background: var(--accent);
    border-radius: 0 4px 4px 0;
    transition: transform 0.35s var(--ease-out-back);
  }

  .nav-btn:hover {
    background: var(--bg-secondary);
    color: var(--text);
    transform: translateX(4px);
  }

  .nav-btn.active {
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 600;
    transform: translateX(4px);
  }

  .nav-btn.active::before {
    transform: translateY(-50%) scaleY(1);
  }

  .nav-btn i {
    width: 20px;
    text-align: center;
    transition: transform 0.3s var(--ease-out-back);
  }

  .nav-btn:hover i {
    transform: scale(1.15);
  }

  /* ===== Main ===== */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
    min-width: 0;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    opacity: 0;
    animation: fadeIn 0.5s var(--ease-smooth) 0.2s forwards;
  }

  .page-title {
    font-size: 24px;
    font-weight: 700;
    transition: opacity 0.3s var(--ease-smooth), transform 0.3s var(--ease-out-expo);
  }

  .search-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .search-input {
    width: 240px;
    padding: 10px 16px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--bg-secondary);
    font-size: 14px;
    outline: none;
    font-family: inherit;
    transition: all 0.35s var(--ease-out-expo);
    will-change: transform, box-shadow;
  }

  .search-input:focus {
    width: 300px;
    border-color: var(--accent);
    background: var(--bg);
    box-shadow: 0 0 0 4px var(--accent-light), 0 4px 20px rgba(0,102,255,0.08);
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--bg-secondary);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s var(--ease-out-back);
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    will-change: transform;
  }

  .icon-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(0,102,255,0.15) 0%, transparent 70%);
    transform: scale(0);
    transition: transform 0.4s var(--ease-out-expo);
    border-radius: 50%;
  }

  .icon-btn:hover {
    background: var(--accent-light);
    color: var(--accent);
    transform: scale(1.12) rotate(5deg);
  }

  .icon-btn:hover::after {
    transform: scale(2);
  }

  .icon-btn:active {
    transform: scale(0.92);
    transition-duration: 0.1s;
  }

  /* ===== Content ===== */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
    padding-bottom: 120px;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeSlideUp 0.5s var(--ease-out-expo) 0.3s forwards;
  }

  .content::-webkit-scrollbar {
    width: 6px;
  }
  .content::-webkit-scrollbar-track {
    background: transparent;
  }
  .content::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
    transition: background 0.2s;
  }
  .content::-webkit-scrollbar-thumb:hover {
    background: var(--text-secondary);
  }

  .section-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    margin-top: 8px;
    opacity: 0;
    transform: translateY(6px);
    animation: fadeSlideUp 0.4s var(--ease-out-expo) forwards;
  }

  /* ===== Song Card ===== */
  .song-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .song-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    transition: all 0.4s var(--ease-out-expo);
    position: relative;
    overflow: hidden;
    will-change: transform, box-shadow;
    opacity: 0;
    transform: translateY(16px) scale(0.97);
    animation: cardEnter 0.5s var(--ease-out-expo) forwards;
  }

  .song-card:nth-child(1) { animation-delay: 0.05s; }
  .song-card:nth-child(2) { animation-delay: 0.1s; }
  .song-card:nth-child(3) { animation-delay: 0.15s; }
  .song-card:nth-child(4) { animation-delay: 0.2s; }
  .song-card:nth-child(5) { animation-delay: 0.25s; }
  .song-card:nth-child(6) { animation-delay: 0.3s; }

  .song-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), #5856d6);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s var(--ease-out-expo);
  }

  .song-card:hover {
    box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    transform: translateY(-4px) scale(1.01);
    border-color: transparent;
  }

  .song-card:hover::before {
    transform: scaleX(1);
  }

  .song-card:active {
    transform: translateY(-1px) scale(0.99);
    transition-duration: 0.15s;
  }

  .cover {
    width: 56px;
    height: 56px;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, #e0e0e0, #c0c0c0);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 20px;
    overflow: hidden;
    transition: transform 0.4s var(--ease-out-back), box-shadow 0.4s var(--ease-smooth);
    will-change: transform;
  }

  .song-card:hover .cover {
    transform: scale(1.08) rotate(2deg);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }

  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s var(--ease-smooth);
  }

  .song-card:hover .cover img {
    transform: scale(1.1);
  }

  .song-info {
    flex: 1;
    min-width: 0;
    transition: transform 0.3s var(--ease-smooth);
  }

  .song-card:hover .song-info {
    transform: translateX(2px);
  }

  .song-name {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
    transition: color 0.2s;
  }

  .song-card:hover .song-name {
    color: var(--accent);
  }

  .song-artist {
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.2s;
  }

  .song-actions {
    display: flex;
    gap: 6px;
    opacity: 0;
    transform: translateX(8px);
    transition: all 0.35s var(--ease-out-expo);
  }

  .song-card:hover .song-actions {
    opacity: 1;
    transform: translateX(0);
  }

  .action-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--bg-secondary);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: all 0.25s var(--ease-out-back);
    will-change: transform;
  }

  .action-btn:hover {
    background: var(--accent-light);
    color: var(--accent);
    transform: scale(1.2) rotate(10deg);
  }

  .action-btn:active {
    transform: scale(0.9);
    transition-duration: 0.1s;
  }

  .action-btn.liked {
    color: #ff2d55;
    background: rgba(255,45,85,0.1);
    animation: heartBeat 0.4s var(--ease-out-back);
  }

  @keyframes heartBeat {
    0% { transform: scale(1); }
    30% { transform: scale(1.3); }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  /* ===== Mini Player ===== */
  .mini-player {
    position: fixed;
    bottom: 20px;
    left: 220px;
    right: 20px;
    height: 72px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--border);
    border-radius: 100px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
    display: flex;
    align-items: center;
    padding: 0 24px 0 8px;
    gap: 16px;
    cursor: pointer;
    z-index: 100;
    transition: all 0.5s var(--ease-out-expo);
    will-change: transform, box-shadow;
    opacity: 0;
    transform: translateY(40px);
    animation: slideUp 0.7s var(--ease-out-expo) 0.5s forwards;
  }

  .mini-player:hover {
    box-shadow: 0 16px 48px rgba(0,0,0,0.12);
    transform: translateY(-4px) scale(1.005);
  }

  .mini-player:active {
    transform: translateY(-1px) scale(0.995);
    transition-duration: 0.15s;
  }

  .mini-cover {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #e0e0e0, #c0c0c0);
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    transition: all 0.5s var(--ease-out-expo);
    will-change: transform;
  }

  .mini-cover.playing {
    animation: rotateCover 8s linear infinite;
  }

  .mini-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @keyframes rotateCover {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .mini-play {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--text);
    color: var(--bg);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.3s var(--ease-out-back);
    flex-shrink: 0;
    will-change: transform;
  }

  .mini-play:hover {
    transform: scale(1.15);
    background: var(--accent);
  }

  .mini-play:active {
    transform: scale(0.9);
    transition-duration: 0.1s;
  }

  .mini-meta {
    flex: 1;
    min-width: 0;
    overflow: hidden;
  }

  .mini-title {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all 0.3s var(--ease-smooth);
  }

  .mini-lyric {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
    transition: all 0.3s var(--ease-smooth);
  }

  /* ===== Fullscreen Player ===== */
  .fullscreen-player {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 1000;
    display: none;
    flex-direction: column;
    opacity: 0;
    transform: scale(0.96);
    transition: opacity 0.4s var(--ease-smooth), transform 0.4s var(--ease-out-expo);
    will-change: transform, opacity;
  }

  .fullscreen-player.show {
    display: flex;
    opacity: 1;
    transform: scale(1);
  }

  .fs-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    opacity: 0;
    transform: translateY(-10px);
    transition: all 0.4s var(--ease-out-expo) 0.1s;
  }

  .fullscreen-player.show .fs-header {
    opacity: 1;
    transform: translateY(0);
  }

  .fs-body {
    flex: 1;
    display: flex;
    padding: 40px 60px;
    gap: 60px;
    overflow: hidden;
  }

  .fs-left {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateX(-30px) scale(0.95);
    transition: all 0.6s var(--ease-out-expo) 0.15s;
  }

  .fullscreen-player.show .fs-left {
    opacity: 1;
    transform: translateX(0) scale(1);
  }

  .fs-cover {
    width: 320px;
    height: 320px;
    border-radius: var(--radius);
    background: linear-gradient(135deg, #e0e0e0, #c0c0c0);
    box-shadow: 0 24px 80px rgba(0,0,0,0.15);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 64px;
    transition: all 0.5s var(--ease-out-expo);
    will-change: transform, box-shadow;
  }

  .fs-cover.playing {
    animation: breathe 3s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); box-shadow: 0 24px 80px rgba(0,0,0,0.15); }
    50% { transform: scale(1.02); box-shadow: 0 32px 100px rgba(0,0,0,0.2); }
  }

  .fs-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.8s var(--ease-smooth);
  }

  .fs-right {
    width: 400px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    opacity: 0;
    transform: translateX(30px);
    transition: all 0.6s var(--ease-out-expo) 0.25s;
  }

  .fullscreen-player.show .fs-right {
    opacity: 1;
    transform: translateX(0);
  }

  .fs-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    transition: all 0.3s var(--ease-smooth);
  }

  .fs-artist {
    font-size: 16px;
    color: var(--text-secondary);
    margin-bottom: 32px;
    transition: all 0.3s var(--ease-smooth);
  }

  .fs-lyrics {
    flex: 1;
    overflow-y: auto;
    padding-right: 16px;
    mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
    scroll-behavior: smooth;
  }

  .fs-lyrics::-webkit-scrollbar {
    width: 4px;
  }
  .fs-lyrics::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 2px;
  }

  .lyric-line {
    font-size: 16px;
    color: var(--text-secondary);
    line-height: 2.6;
    transition: all 0.5s var(--ease-out-expo);
    transform-origin: left;
    will-change: transform, opacity, color;
  }

  .lyric-line.active {
    color: var(--text);
    font-weight: 600;
    font-size: 20px;
    transform: scale(1.05) translateX(8px);
  }

  .fs-controls {
    margin-top: 24px;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.5s var(--ease-out-expo) 0.35s;
  }

  .fullscreen-player.show .fs-controls {
    opacity: 1;
    transform: translateY(0);
  }

  .progress-box {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .progress-bar {
    flex: 1;
    height: 4px;
    background: var(--bg-secondary);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: height 0.2s var(--ease-smooth);
  }

  .progress-bar:hover {
    height: 6px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #5856d6);
    border-radius: 2px;
    width: 0%;
    position: relative;
    transition: width 0.1s linear;
    will-change: width;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    right: -8px;
    top: 50%;
    transform: translateY(-50%) scale(0);
    width: 16px;
    height: 16px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 0 6px rgba(0,102,255,0.15);
    transition: transform 0.3s var(--ease-out-back);
    will-change: transform;
  }

  .progress-bar:hover .progress-fill::after {
    transform: translateY(-50%) scale(1);
  }

  .time {
    font-size: 12px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    min-width: 40px;
    transition: color 0.2s;
  }

  .fs-buttons {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }

  .fs-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--bg-secondary);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.3s var(--ease-out-back);
    will-change: transform;
    position: relative;
    overflow: hidden;
  }

  .fs-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(0,102,255,0.1) 0%, transparent 70%);
    transform: scale(0);
    transition: transform 0.4s var(--ease-out-expo);
    border-radius: 50%;
  }

  .fs-btn:hover {
    background: var(--accent-light);
    color: var(--accent);
    transform: scale(1.15) translateY(-2px);
  }

  .fs-btn:hover::after {
    transform: scale(2.5);
  }

  .fs-btn:active {
    transform: scale(0.92);
    transition-duration: 0.1s;
  }

  .fs-btn.large {
    width: 64px;
    height: 64px;
    background: var(--text);
    color: var(--bg);
    font-size: 20px;
    transition: all 0.35s var(--ease-out-back);
  }

  .fs-btn.large:hover {
    background: var(--accent);
    transform: scale(1.12) translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,102,255,0.3);
  }

  .fs-btn.active {
    color: var(--accent);
    background: var(--accent-light);
  }

  .fs-actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    justify-content: center;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.4s var(--ease-out-expo) 0.45s;
  }

  .fullscreen-player.show .fs-actions {
    opacity: 1;
    transform: translateY(0);
  }

  .fs-action-btn {
    padding: 10px 20px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s var(--ease-out-back);
    font-family: inherit;
    will-change: transform;
  }

  .fs-action-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,102,255,0.1);
  }

  .fs-action-btn:active {
    transform: translateY(0) scale(0.96);
    transition-duration: 0.1s;
  }

  .fs-action-btn.liked {
    border-color: #ff2d55;
    color: #ff2d55;
    background: rgba(255,45,85,0.05);
    animation: heartBeat 0.4s var(--ease-out-back);
  }

  /* ===== Playlist ===== */
  .playlist-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeSlideUp 0.4s var(--ease-out-expo) forwards;
  }

  .new-btn {
    padding: 10px 20px;
    border-radius: 100px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: inherit;
    transition: all 0.3s var(--ease-out-back);
    will-change: transform;
    position: relative;
    overflow: hidden;
  }

  .new-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }

  .new-btn:hover {
    opacity: 0.9;
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 8px 24px rgba(0,102,255,0.2);
  }

  .new-btn:hover::after {
    transform: translateX(100%);
  }

  .new-btn:active {
    transform: translateY(0) scale(0.97);
    transition-duration: 0.1s;
  }

  .playlist-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .playlist-card {
    padding: 20px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    transition: all 0.4s var(--ease-out-expo);
    opacity: 0;
    transform: translateY(12px) scale(0.98);
    animation: cardEnter 0.5s var(--ease-out-expo) forwards;
    will-change: transform, box-shadow;
    position: relative;
    overflow: hidden;
  }

  .playlist-card:nth-child(1) { animation-delay: 0.05s; }
  .playlist-card:nth-child(2) { animation-delay: 0.1s; }
  .playlist-card:nth-child(3) { animation-delay: 0.15s; }
  .playlist-card:nth-child(4) { animation-delay: 0.2s; }

  .playlist-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), #5856d6);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s var(--ease-out-expo);
  }

  .playlist-card:hover {
    box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    transform: translateY(-4px) scale(1.02);
    border-color: transparent;
  }

  .playlist-card:hover::before {
    transform: scaleX(1);
  }

  .playlist-card:active {
    transform: translateY(-1px) scale(0.99);
    transition-duration: 0.15s;
  }

  .playlist-name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: color 0.2s;
  }

  .playlist-card:hover .playlist-name {
    color: var(--accent);
  }

  .playlist-count {
    font-size: 13px;
    color: var(--text-secondary);
    transition: all 0.2s;
  }

  .playlist-delete {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s var(--ease-out-back);
    opacity: 0;
    transform: scale(0.8);
  }

  .playlist-card:hover .playlist-delete {
    opacity: 1;
    transform: scale(1);
  }

  .playlist-delete:hover {
    background: rgba(255,45,85,0.1);
    color: #ff2d55;
    transform: scale(1.15) !important;
  }

  .playlist-delete:active {
    transform: scale(0.9) !important;
    transition-duration: 0.1s;
  }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s var(--ease-smooth);
  }

  .modal-overlay.show {
    display: flex;
    opacity: 1;
  }

  .modal {
    background: var(--bg);
    border-radius: var(--radius);
    padding: 28px;
    width: 360px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.2);
    transform: scale(0.9) translateY(20px);
    opacity: 0;
    transition: all 0.4s var(--ease-out-back);
    will-change: transform, opacity;
  }

  .modal-overlay.show .modal {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .modal-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 20px;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.3s var(--ease-out-expo) 0.1s;
  }

  .modal-overlay.show .modal-title {
    opacity: 1;
    transform: translateY(0);
  }

  .modal-input {
    width: 100%;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    font-size: 15px;
    margin-bottom: 20px;
    outline: none;
    font-family: inherit;
    transition: all 0.3s var(--ease-smooth);
    opacity: 0;
    transform: translateY(8px);
    animation: fadeSlideUp 0.3s var(--ease-out-expo) 0.15s forwards;
  }

  .modal-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-light);
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeSlideUp 0.3s var(--ease-out-expo) 0.2s forwards;
  }

  .modal-btn {
    padding: 10px 18px;
    border-radius: var(--radius-sm);
    border: none;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.25s var(--ease-out-back);
    will-change: transform;
  }

  .modal-btn:hover {
    transform: translateY(-2px);
  }

  .modal-btn:active {
    transform: translateY(0) scale(0.96);
    transition-duration: 0.1s;
  }

  .modal-btn.secondary {
    background: var(--bg-secondary);
    color: var(--text);
  }

  .modal-btn.secondary:hover {
    background: #e8e8ed;
  }

  .modal-btn.primary {
    background: var(--accent);
    color: white;
  }

  .modal-btn.primary:hover {
    box-shadow: 0 4px 16px rgba(0,102,255,0.25);
  }

  /* ===== Result Section ===== */
  .result-section {
    margin-bottom: 32px;
    opacity: 0;
    transform: translateY(16px);
    animation: fadeSlideUp 0.5s var(--ease-out-expo) forwards;
  }

  .result-section:nth-child(1) { animation-delay: 0.1s; }
  .result-section:nth-child(2) { animation-delay: 0.2s; }

  .result-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--text-secondary);
    transition: color 0.2s;
  }

  .result-header i {
    font-size: 18px;
    transition: transform 0.3s var(--ease-out-back);
  }

  .result-header:hover i {
    transform: scale(1.2) rotate(5deg);
  }

  /* ===== Empty ===== */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
    opacity: 0;
    animation: fadeIn 0.5s var(--ease-smooth) forwards;
  }

  .empty i {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.3;
    display: block;
    transition: all 0.5s var(--ease-out-expo);
  }

  .empty:hover i {
    opacity: 0.5;
    transform: scale(1.1) rotate(5deg);
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    top: 24px;
    right: 24px;
    background: var(--text);
    color: var(--bg);
    padding: 14px 24px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    z-index: 3000;
    transform: translateX(120%) scale(0.9);
    opacity: 0;
    transition: all 0.5s var(--ease-out-expo);
    box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    will-change: transform, opacity;
  }

  .toast.show {
    transform: translateX(0) scale(1);
    opacity: 1;
  }

  .toast.hide {
    transform: translateX(120%) scale(0.9);
    opacity: 0;
  }

  /* ===== Animations ===== */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeSlideRight {
    from { opacity: 0; transform: translateX(-16px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* ===== Spinner for loading ===== */
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--bg-secondary);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">mpMusic</div>
    <button class="nav-btn active" data-page="home" onclick="nav('home')">
      <i class="fa-solid fa-house"></i> 首页
    </button>
    <button class="nav-btn" data-page="playlist" onclick="nav('playlist')">
      <i class="fa-solid fa-list-ul"></i> 歌单
    </button>
    <button class="nav-btn" data-page="my" onclick="nav('my')">
      <i class="fa-solid fa-heart"></i> 我的
    </button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="page-title" id="pageTitle">首页</div>
      <div class="search-wrap">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索歌曲、歌手..." onkeydown="if(event.key==='Enter') doSearch()">
        <button class="icon-btn" onclick="doSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
    </header>

    <div class="content" id="content"></div>
  </main>

  <div class="mini-player" id="miniPlayer" onclick="openFullscreen()">
    <div class="mini-cover" id="miniCover">
      <i class="fa-solid fa-music"></i>
    </div>
    <button class="mini-play" id="miniPlay" onclick="event.stopPropagation();togglePlay()">
      <i class="fa-solid fa-play"></i>
    </button>
    <div class="mini-meta">
      <div class="mini-title" id="miniTitle">未在播放</div>
      <div class="mini-lyric" id="miniLyric">选择一首歌曲开始</div>
    </div>
  </div>

  <div class="fullscreen-player" id="fullscreenPlayer">
    <div class="fs-header">
      <div style="font-weight:700;font-size:18px;">正在播放</div>
      <button class="icon-btn" onclick="closeFullscreen()" style="width:40px;height:40px;"><i class="fa-solid fa-chevron-down"></i></button>
    </div>
    <div class="fs-body">
      <div class="fs-left">
        <div class="fs-cover" id="fsCover">
          <i class="fa-solid fa-music"></i>
        </div>
      </div>
      <div class="fs-right">
        <div class="fs-title" id="fsTitle">未在播放</div>
        <div class="fs-artist" id="fsArtist">-</div>
        <div class="fs-lyrics" id="fsLyrics">
          <div class="lyric-line active">暂无歌词</div>
        </div>
        <div class="fs-controls">
          <div class="progress-box">
            <span class="time" id="fsCurrent">0:00</span>
            <div class="progress-bar" id="fsProgressBar" onclick="seek(event)">
              <div class="progress-fill" id="fsProgressFill" style="width:0%"></div>
            </div>
            <span class="time" id="fsDuration">0:00</span>
          </div>
          <div class="fs-buttons">
            <button class="fs-btn" id="fsLoopBtn" onclick="toggleLoop()" title="单曲循环"><i class="fa-solid fa-repeat"></i></button>
            <button class="fs-btn" onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
            <button class="fs-btn large" id="fsPlayBtn" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>
            <button class="fs-btn" onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>
            <button class="fs-btn" onclick="toggleLikeCurrent()" id="fsLikeBtn" title="喜欢"><i class="fa-solid fa-heart"></i></button>
          </div>
          <div class="fs-actions">
            <button class="fs-action-btn" onclick="downloadCurrent()"><i class="fa-solid fa-download"></i> 下载</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title" id="modalTitle">新建歌单</div>
      <input type="text" class="modal-input" id="modalInput" placeholder="输入歌单名称" onkeydown="if(event.key==='Enter') confirmModal()">
      <div class="modal-actions">
        <button class="modal-btn secondary" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" onclick="confirmModal()">确定</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<audio id="audio" style="display:none"></audio>

<script>
const API_KEY = '9a36c99b7cf7cf30f903a182cfcd7953';
const API_BASE = 'https://jkapi.com/api/music';

let state = {
  page: 'home',
  playlists: [],
  liked: [],
  current: null,
  isPlaying: false,
  loop: false,
  queue: [],
  queueIndex: 0,
  lyrics: [],
  lyricIndex: 0
};

const audio = document.getElementById('audio');

function init() {
  loadData();
  renderHome();
  initAudio();
  autoRecommend();
}

function loadData() {
  try {
    state.playlists = JSON.parse(localStorage.getItem('mp_playlists') || '[]');
    state.liked = JSON.parse(localStorage.getItem('mp_liked') || '[]');
  } catch(e) { state.playlists = []; state.liked = []; }
}

function saveData() {
  localStorage.setItem('mp_playlists', JSON.stringify(state.playlists));
  localStorage.setItem('mp_liked', JSON.stringify(state.liked));
}

function nav(page) {
  state.page = page;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  const titles = { home: '首页', playlist: '歌单', my: '我的' };
  const titleEl = document.getElementById('pageTitle');
  titleEl.style.opacity = '0';
  titleEl.style.transform = 'translateY(6px)';
  setTimeout(() => {
    titleEl.textContent = titles[page];
    titleEl.style.transition = 'all 0.35s cubic-bezier(0.16, 1, 0.3, 1)';
    titleEl.style.opacity = '1';
    titleEl.style.transform = 'translateY(0)';
  }, 120);
  if (page === 'home') renderHome();
  else if (page === 'playlist') renderPlaylist();
  else if (page === 'my') renderMy();
}

/* Home */
function renderHome() {
  const el = document.getElementById('content');
  if (!state.queue.length) {
    el.innerHTML = `<div class="section-title" style="animation-delay:0.05s">推荐歌曲</div><div class="empty"><div class="spinner"></div><div>正在加载推荐...</div></div>`;
    return;
  }
  el.innerHTML = `<div class="section-title" style="animation-delay:0.05s">推荐歌曲</div><div class="song-grid">${state.queue.map((s, i) => songCard(s, i, true)).join('')}</div>`;
}

function autoRecommend() {
  searchPlatform('wy', '热门').then(data => {
    const list = normalizeResults(data, 'wy').slice(0, 6);
    if (list.length) {
      state.queue = list;
      state.queueIndex = 0;
      renderHome();
    } else {
      fallbackRecommend();
    }
  }).catch(() => fallbackRecommend());
}

function fallbackRecommend() {
  state.queue = [
    {id:'r1', name:'晴天', artist:'周杰伦', album:'叶惠美', url:'', platform:'wy'},
    {id:'r2', name:'七里香', artist:'周杰伦', album:'七里香', url:'', platform:'wy'},
    {id:'r3', name:'起风了', artist:'买辣椒也用券', album:'', url:'', platform:'wy'},
    {id:'r4', name:'告白气球', artist:'周杰伦', album:'周杰伦的床边故事', url:'', platform:'wy'},
    {id:'r5', name:'演员', artist:'薛之谦', album:'初学者', url:'', platform:'wy'},
    {id:'r6', name:'后来', artist:'刘若英', album:'我等你', url:'', platform:'wy'}
  ];
  renderHome();
}

/* Playlist */
function renderPlaylist() {
  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="playlist-header">
      <div class="section-title" style="animation-delay:0.05s">我的歌单</div>
      <button class="new-btn" onclick="newPlaylist()"><i class="fa-solid fa-plus"></i> 新建歌单</button>
    </div>
    <div class="playlist-list" id="playlistGrid"></div>
    <div id="playlistDetail" style="display:none;margin-top:24px;"></div>
  `;
  renderPlaylistList();
}

function renderPlaylistList() {
  const grid = document.getElementById('playlistGrid');
  if (!grid) return;
  if (state.playlists.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;"><i class="fa-solid fa-folder-open"></i><div>暂无歌单，点击右上角新建</div></div>`;
    return;
  }
  grid.innerHTML = state.playlists.map((p, idx) => `
    <div class="playlist-card" onclick="showPlaylist(${idx})">
      <div class="playlist-name">
        ${esc(p.name)}
        <button class="playlist-delete" onclick="event.stopPropagation();deletePlaylist(${idx})"><i class="fa-solid fa-trash"></i></button>
      </div>
      <div class="playlist-count">${p.songs.length} 首歌曲</div>
    </div>
  `).join('');
}

function newPlaylist() {
  document.getElementById('modalTitle').textContent = '新建歌单';
  document.getElementById('modalInput').value = '';
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('modalInput').focus();
  window.modalCallback = (name) => {
    if (!name) return;
    state.playlists.push({ id: Date.now(), name, songs: [] });
    saveData();
    renderPlaylistList();
    toast('歌单创建成功');
  };
}

function deletePlaylist(idx) {
  if (!confirm('确定删除该歌单？')) return;
  state.playlists.splice(idx, 1);
  saveData();
  renderPlaylistList();
  const detail = document.getElementById('playlistDetail');
  if (detail) detail.style.display = 'none';
}

function showPlaylist(idx) {
  const p = state.playlists[idx];
  const detail = document.getElementById('playlistDetail');
  detail.style.display = 'block';
  detail.style.opacity = '0';
  detail.style.transform = 'translateY(12px)';
  detail.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;opacity:0;animation:fadeSlideUp 0.4s cubic-bezier(0.16,1,0.3,1) forwards;">
      <div class="section-title">${esc(p.name)}</div>
      <button class="icon-btn" onclick="playPlaylist(${idx})" title="播放全部"><i class="fa-solid fa-play"></i></button>
    </div>
    <div class="song-grid">
      ${p.songs.length ? p.songs.map((s, i) => songCard(s, i)).join('') : '<div class="empty" style="grid-column:1/-1;"><i class="fa-solid fa-music"></i><div>暂无歌曲</div></div>'}
    </div>
  `;
  requestAnimationFrame(() => {
    detail.style.transition = 'all 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
    detail.style.opacity = '1';
    detail.style.transform = 'translateY(0)';
  });
}

function playPlaylist(idx) {
  const p = state.playlists[idx];
  if (!p.songs.length) return;
  state.queue = [...p.songs];
  state.queueIndex = 0;
  playSong(state.queue[0]);
}

function addToPlaylist(songStr) {
  const song = typeof songStr === 'string' ? JSON.parse(songStr) : songStr;
  if (state.playlists.length === 0) {
    toast('请先创建歌单');
    return;
  }
  const names = state.playlists.map((p, i) => `${i + 1}. ${p.name}`).join('\n');
  const idx = prompt(`选择歌单（输入序号 1-${state.playlists.length}）：\n${names}`);
  const i = parseInt(idx) - 1;
  if (i >= 0 && i < state.playlists.length) {
    if (!state.playlists[i].songs.find(s => s.id === song.id && s.platform === song.platform)) {
      state.playlists[i].songs.push(song);
      saveData();
      toast('已添加到歌单');
    } else {
      toast('歌曲已存在');
    }
  }
}

/* My */
function renderMy() {
  const el = document.getElementById('content');
  el.innerHTML = `<div class="section-title" style="animation-delay:0.05s">我喜欢的歌曲</div><div class="song-grid" id="myGrid"></div>`;
  const grid = document.getElementById('myGrid');
  if (state.liked.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;"><i class="fa-solid fa-heart"></i><div>暂无喜欢的歌曲</div></div>`;
    return;
  }
  grid.innerHTML = state.liked.map((s, i) => songCard(s, i)).join('');
}

function isLiked(song) {
  return state.liked.some(l => l.id === song.id && l.platform === song.platform);
}

function toggleLike(songStr, btn) {
  const song = typeof songStr === 'string' ? JSON.parse(songStr) : songStr;
  const idx = state.liked.findIndex(l => l.id === song.id && l.platform === song.platform);
  if (idx > -1) {
    state.liked.splice(idx, 1);
    if (btn) btn.classList.remove('liked');
    toast('已取消喜欢');
  } else {
    state.liked.push(song);
    if (btn) btn.classList.add('liked');
    toast('已加入喜欢');
  }
  saveData();
  if (state.page === 'my') renderMy();
  updateLikeBtn();
}

function toggleLikeCurrent() {
  if (!state.current) return;
  toggleLike(state.current);
}

function updateLikeBtn() {
  const btn = document.getElementById('fsLikeBtn');
  if (!state.current) return;
  if (isLiked(state.current)) btn.classList.add('liked');
  else btn.classList.remove('liked');
}

/* Search */
async function doSearch() {
  const kw = document.getElementById('searchInput').value.trim();
  if (!kw) return;
  nav('home');
  const el = document.getElementById('content');
  el.innerHTML = `<div class="section-title" style="animation-delay:0.05s">搜索结果</div><div id="searchResults"></div>`;
  const container = document.getElementById('searchResults');
  container.innerHTML = '<div class="empty"><div class="spinner"></div><div>搜索中...</div></div>';

  const [wy, qq] = await Promise.allSettled([
    searchPlatform('wy', kw),
    searchPlatform('qq', kw)
  ]);

  let html = '';
  html += `<div class="result-section"><div class="result-header"><i class="fa-solid fa-cloud"></i> 网易云音乐</div>`;
  if (wy.status === 'fulfilled' && wy.value) {
    const list = normalizeResults(wy.value, 'wy');
    html += list.length ? `<div class="song-grid">${list.map((s, i) => songCard(s, i)).join('')}</div>` : `<div class="empty">无结果</div>`;
  } else {
    html += `<div class="empty">请求失败</div>`;
  }
  html += `</div>`;

  html += `<div class="result-section"><div class="result-header"><i class="fa-solid fa-music"></i> QQ 音乐</div>`;
  if (qq.status === 'fulfilled' && qq.value) {
    const list = normalizeResults(qq.value, 'qq');
    html += list.length ? `<div class="song-grid">${list.map((s, i) => songCard(s, i)).join('')}</div>` : `<div class="empty">无结果</div>`;
  } else {
    html += `<div class="empty">请求失败</div>`;
  }
  html += `</div>`;

  container.innerHTML = html;
}

async function searchPlatform(plat, name) {
  const url = `${API_BASE}?plat=${plat}&type=json&apiKey=${API_KEY}&name=${encodeURIComponent(name)}`;
  try {
    const res = await fetch(url);
    return await res.json();
  } catch (e) { return null; }
}

function normalizeResults(data, platform) {
  if (!data || data.code !== 1) return [];
  if (data.music_url) {
    return [{
      id: data.id || data.songid || Date.now(),
      name: data.name || data.song_name || '未知',
      artist: data.artist || data.singer || '未知',
      album: data.album || data.album_name || '',
      url: data.music_url || data.url || '',
      cover: data.cover || '',
      platform
    }];
  }
  if (Array.isArray(data.data)) {
    return data.data.map((item, i) => ({
      id: item.id || item.songid || (Date.now() + i),
      name: item.name || item.song_name || '未知',
      artist: item.artist || item.singer || '未知',
      album: item.album || item.album_name || '',
      url: item.music_url || item.url || item.mp3_url || '',
      cover: item.cover || '',
      platform
    })).filter(s => s.url);
  }
  return [];
}

/* Player */
function initAudio() {
  audio.addEventListener('timeupdate', updateProgress);
  audio.addEventListener('ended', onEnded);
  audio.addEventListener('loadedmetadata', () => {
    document.getElementById('fsDuration').textContent = fmt(audio.duration);
  });
}

function playSong(song) {
  if (!song || !song.url) {
    toast('该歌曲暂无播放链接');
    return;
  }
  state.current = song;
  audio.src = song.url;
  audio.loop = state.loop;
  audio.play().then(() => {
    state.isPlaying = true;
    updateUI();
    updateLikeBtn();
    generateLyrics();
  }).catch(() => toast('播放失败'));
}

function togglePlay() {
  if (!state.current) {
    if (state.queue.length) { playSong(state.queue[0]); return; }
    toast('请先选择歌曲'); return;
  }
  if (state.isPlaying) { audio.pause(); state.isPlaying = false; }
  else { audio.play(); state.isPlaying = true; }
  updateUI();
}

function updateUI() {
  const icon = state.isPlaying ? 'fa-pause' : 'fa-play';
  document.getElementById('miniPlay').innerHTML = `<i class="fa-solid ${icon}"></i>`;
  document.getElementById('fsPlayBtn').innerHTML = `<i class="fa-solid ${icon}"></i>`;
  const miniCover = document.getElementById('miniCover');
  const fsCover = document.getElementById('fsCover');
  if (state.isPlaying) {
    miniCover.classList.add('playing');
    fsCover.classList.add('playing');
  } else {
    miniCover.classList.remove('playing');
    fsCover.classList.remove('playing');
  }
  if (state.current) {
    document.getElementById('miniTitle').textContent = state.current.name;
    document.getElementById('miniLyric').textContent = state.current.artist;
    document.getElementById('fsTitle').textContent = state.current.name;
    document.getElementById('fsArtist').textContent = state.current.artist;
    const coverHtml = state.current.cover ? `<img src="${esc(state.current.cover)}" alt="">` : '<i class="fa-solid fa-music"></i>';
    document.getElementById('miniCover').innerHTML = coverHtml;
    document.getElementById('fsCover').innerHTML = coverHtml;
  }
}

function updateProgress() {
  if (!state.current) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  document.getElementById('fsProgressFill').style.width = pct + '%';
  document.getElementById('fsCurrent').textContent = fmt(audio.currentTime);
  const line = getCurrentLyric(audio.currentTime);
  if (line !== state.lyricIndex) {
    state.lyricIndex = line;
    renderLyrics();
  }
}

function seek(e) {
  const bar = document.getElementById('fsProgressBar');
  const rect = bar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
}

function onEnded() {
  if (state.loop) audio.play();
  else nextSong();
}

function toggleLoop() {
  state.loop = !state.loop;
  audio.loop = state.loop;
  document.getElementById('fsLoopBtn').classList.toggle('active', state.loop);
  toast(state.loop ? '已开启单曲循环' : '已关闭单曲循环');
}

function prevSong() {
  if (!state.queue.length) return;
  state.queueIndex = (state.queueIndex - 1 + state.queue.length) % state.queue.length;
  playSong(state.queue[state.queueIndex]);
}

function nextSong() {
  if (!state.queue.length) return;
  state.queueIndex = (state.queueIndex + 1) % state.queue.length;
  playSong(state.queue[state.queueIndex]);
}

function openFullscreen() {
  if (!state.current) return;
  document.getElementById('fullscreenPlayer').classList.add('show');
}

function closeFullscreen() {
  document.getElementById('fullscreenPlayer').classList.remove('show');
}

function downloadCurrent() {
  if (!state.current || !state.current.url) return;
  const a = document.createElement('a');
  a.href = state.current.url;
  a.download = `${state.current.name} - ${state.current.artist}.mp3`;
  a.target = '_blank';
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('开始下载');
}

/* Lyrics */
function generateLyrics() {
  const lines = [
    state.current.name,
    state.current.artist,
    '正在播放中...',
    '这是一段模拟歌词',
    '音乐让心灵共鸣',
    '享受此刻的美好',
    '旋律在空气中流淌',
    '每一个音符都是故事',
    '与你分享这份感动',
    '音乐永远不会停止'
  ];
  state.lyrics = lines.map((t, i) => ({ time: i * 5, text: t }));
  state.lyricIndex = 0;
  renderLyrics();
}

function getCurrentLyric(time) {
  for (let i = state.lyrics.length - 1; i >= 0; i--) {
    if (time >= state.lyrics[i].time) return i;
  }
  return 0;
}

function renderLyrics() {
  const box = document.getElementById('fsLyrics');
  if (!state.lyrics.length) return;
  box.innerHTML = state.lyrics.map((l, i) => `
    <div class="lyric-line ${i === state.lyricIndex ? 'active' : ''}">${esc(l.text)}</div>
  `).join('');
  const active = box.querySelector('.active');
  if (active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* UI Components */
function songCard(song, idx, isQueue = false) {
  const liked = isLiked(song);
  const s = JSON.stringify(song).replace(/"/g, '&quot;');
  const delay = isQueue ? (idx * 0.05 + 0.1) : (idx * 0.05);
  return `
    <div class="song-card" style="animation-delay:${delay}s" onclick="playFrom('${s}')">
      <div class="cover">
        ${song.cover ? `<img src="${esc(song.cover)}" alt="">` : '<i class="fa-solid fa-music"></i>'}
      </div>
      <div class="song-info">
        <div class="song-name">${esc(song.name)}</div>
        <div class="song-artist">${esc(song.artist)}${song.album ? ' · ' + esc(song.album) : ''}</div>
      </div>
      <div class="song-actions">
        <button class="action-btn ${liked ? 'liked' : ''}" onclick="event.stopPropagation();toggleLike('${s}', this)"><i class="fa-solid fa-heart"></i></button>
        <button class="action-btn" onclick="event.stopPropagation();addToPlaylist('${s}')"><i class="fa-solid fa-plus"></i></button>
      </div>
    </div>
  `;
}

function playFrom(songStr) {
  const song = JSON.parse(songStr);
  const idx = state.queue.findIndex(q => q.id === song.id && q.platform === song.platform);
  if (idx === -1) {
    state.queue.unshift(song);
    state.queueIndex = 0;
  } else {
    state.queueIndex = idx;
  }
  playSong(song);
}

/* Modal */
function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('show');
}

function confirmModal() {
  const val = document.getElementById('modalInput').value.trim();
  if (window.modalCallback) window.modalCallback(val);
  closeModal();
}

/* Utils */
function esc(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function fmt(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hide');
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    t.classList.add('hide');
    setTimeout(() => t.classList.remove('show', 'hide'), 500);
  }, 2500);
}

init();
</script>
